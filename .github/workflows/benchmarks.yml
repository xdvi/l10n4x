name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: bench-criterion
      - name: Save baseline on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cargo bench -p l10n4x-core --bench lookup -- --save-baseline main
      - name: Compare against baseline on PR
        if: github.event_name == 'pull_request'
        run: |
          cargo bench -p l10n4x-core --bench lookup -- --save-baseline main || true
          chmod +x scripts/check_bench_regression.sh
          ./scripts/check_bench_regression.sh 5 main || {
            echo "::warning::Bench regression script failed; run 'cargo bench -p l10n4x-core --bench lookup -- --save-baseline main' on main to refresh baseline."
            exit 0
          }
      - name: Run full workspace benches (report only)
        run: cargo bench --workspace --no-run && cargo bench -p l10n4x-core --bench lookup 2>&1 | tail -30
